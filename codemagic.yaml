workflows:
  ios-release:
    name: CoreX OS – iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Exact name of the App Store Connect API key integration in Codemagic:
      #   Codemagic → Teams/User settings → Integrations → App Store Connect.
      app_store_connect: CoreX ASC
    environment:
      groups:
        # Codemagic env-var group holding CERTIFICATE_PRIVATE_KEY (the RSA key
        # used to create/reuse the iOS distribution certificate).
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "za.co.corexMobile"
    scripts:
      - name: Create .env (required asset)
        script: cp .env.example .env
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (fetch or create cert + profile)
        script: |
          keychain initialize
          # --create registers the bundle id / creates the distribution
          # certificate and App Store provisioning profile if they don't exist.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # The IPA is uploaded and processed regardless of the flags below —
        # that alone makes it installable by internal TestFlight testers
        # (App Store Connect users), which needs no review.
        #
        # submit_to_testflight submits for EXTERNAL beta review, which requires
        # Beta App Information (feedback email) and Beta App Review Information
        # (name, phone, email) to be filled in under TestFlight → Test
        # Information. Left off so the pipeline doesn't fail on a step that
        # isn't needed to ship to the App Store. Turn on once those forms are
        # filled and you actually want outside testers.
        submit_to_testflight: false
        # Kept manual: the App Store submission is attached to a version record
        # and needs a Resolution Center reply to the 2.1(a) rejection.
        submit_to_app_store: false
