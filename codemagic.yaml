workflows:
  ios-release:
    name: CoreX OS – iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Exact name of the App Store Connect API key integration in Codemagic:
      #   Codemagic → Teams/User settings → Integrations → App Store Connect.
      app_store_connect: CoreX ASC
    environment:
      groups:
        # Codemagic env-var group holding CERTIFICATE_PRIVATE_KEY (the RSA key
        # used to create/reuse the iOS distribution certificate).
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "za.co.corexMobile"
    scripts:
      - name: Create .env (required asset)
        script: cp .env.example .env
      - name: Verify version and API base URL
        script: |
          set -e
          # 1.0.9(15) shipped with kAppBuildNumber still on 13. That constant is
          # what the forced-update gate compares against the server's min_build
          # and what device registration reports, so drift means the gate
          # silently misjudges which build is running. Same class of invisible
          # failure as the permission macros below — fail here instead.
          PUBSPEC_BUILD=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)
          DART_BUILD=$(sed -n 's/^const int kAppBuildNumber = \([0-9][0-9]*\);$/\1/p' lib/config/app_version.dart)
          PUBSPEC_NAME=$(sed -n 's/^version: \(.*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)
          DART_NAME=$(sed -n "s/^const String kAppVersion = '\(.*\)';$/\1/p" lib/config/app_version.dart)
          echo "  pubspec.yaml            $PUBSPEC_NAME+$PUBSPEC_BUILD"
          echo "  lib/config/app_version  $DART_NAME+$DART_BUILD"
          if [ -z "$PUBSPEC_BUILD" ] || [ -z "$DART_BUILD" ]; then
            echo "ERROR: could not parse a version out of one of those files."
            exit 1
          fi
          if [ "$PUBSPEC_BUILD" != "$DART_BUILD" ] || [ "$PUBSPEC_NAME" != "$DART_NAME" ]; then
            echo "ERROR: version drift — bump lib/config/app_version.dart to match pubspec.yaml."
            exit 1
          fi
          # .env is bundled as a flutter asset, so whatever it holds now ships in
          # the binary. The fallback in lib/config/env.dart is STAGING, so a
          # missing or misconfigured file yields an app quietly talking to the
          # wrong backend.
          API=$(sed -n 's/^API_BASE_URL=//p' .env)
          echo "  API_BASE_URL            ${API:-<ABSENT>}"
          if [ "$API" != "https://corexos.co.za/api" ]; then
            echo "ERROR: .env does not point at production. Fix .env.example."
            exit 1
          fi
          echo "Version and API base URL OK."
      - name: Disable Swift Package Manager
        script: |
          set -e
          # MUST run before any flutter build/pub command touches ios/.
          #
          # SPM is on by default in current Flutter stable, and this project
          # also uses CocoaPods. Both then supply GoogleDataTransport, and the
          # build fails with "123 duplicate symbols ... It may be caused by
          # there being both a CocoaPod and Swift Package Manager dependency
          # for the following module(s): GoogleDataTransport".
          #
          # That link error only became visible once ios/Podfile moved to
          # `use_frameworks! :linkage => :static`. Under the previous dynamic
          # linkage the duplicate went undetected at build time and shipped:
          # two copies of the same Objective-C classes in one app, registering
          # against each other at load. That is a prime suspect for the
          # 1.0.9(15) launch crash, so this is a correctness fix, not a
          # convenience one.
          #
          # Flutter warns that disabling SPM will not be allowed forever. The
          # real exit is for the remaining CocoaPods-only plugins to adopt SPM
          # (flutter_local_notifications, flutter_secure_storage,
          # mobile_scanner, open_filex, permission_handler_apple,
          # record_darwin) — until then, one dependency manager only.
          flutter config --no-enable-swift-package-manager
          flutter config | grep -i "swift-package-manager" || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Static analysis and unit tests
        script: |
          set -e
          # Neither of these ran in CI before, so nothing stopped a change that
          # merely compiles from reaching App Review. --fatal-warnings because a
          # warning here (unused import, dead null-aware, unawaited future) is
          # usually the visible end of a real mistake. Infos are left advisory
          # so a lint-rule bump can't block a release.
          flutter analyze --fatal-warnings
          flutter test
      - name: Audit iOS configuration against App Review rules
        script: |
          set -e
          # Source-level review gates, run early for fast feedback. The IPA
          # inspection at the end re-checks the artifact itself; these catch the
          # same classes of mistake before 20 minutes of building.
          PLIST=ios/Runner/Info.plist
          FAIL=0

          echo "Info.plist:"
          # Apple requires iPad apps to be resizable for Split View /
          # Stage Manager. UIRequiresFullScreen opts out and is a review flag.
          if grep -q "UIRequiresFullScreen" "$PLIST"; then
            echo "  ERROR   UIRequiresFullScreen is set — iPad multitasking is opted out of."
            FAIL=1
          else
            echo "  ok      no UIRequiresFullScreen (iPad multitasking allowed)"
          fi
          # Arbitrary loads disables App Transport Security. Apple asks for
          # written justification and rejects unjustified use.
          if grep -q "NSAllowsArbitraryLoads" "$PLIST"; then
            echo "  ERROR   NSAllowsArbitraryLoads present — ATS disabled."
            FAIL=1
          else
            echo "  ok      App Transport Security not weakened"
          fi
          # Without this, every single submission stalls on the export
          # compliance questionnaire before it even reaches a reviewer.
          if grep -q "ITSAppUsesNonExemptEncryption" "$PLIST"; then
            echo "  ok      ITSAppUsesNonExemptEncryption declared"
          else
            echo "  ERROR   ITSAppUsesNonExemptEncryption missing — submission will stall."
            FAIL=1
          fi
          # Apple reviews on iPad and rotates the device.
          IPAD_ORIENTATIONS=$(sed -n '/UISupportedInterfaceOrientations~ipad/,/<\/array>/p' "$PLIST" \
            | grep -c "UIInterfaceOrientation" || true)
          echo "  info    iPad orientations declared: $IPAD_ORIENTATIONS"
          if [ "$IPAD_ORIENTATIONS" -lt 4 ]; then
            echo "  ERROR   iPad must support all four orientations."
            FAIL=1
          fi

          echo
          echo "Permission purpose strings:"
          # A missing string crashes the app the instant the API is touched; a
          # vague one ("we need camera access") gets rejected under 5.1.1 for
          # not explaining WHY. Length is a crude proxy, but it catches the
          # placeholder that someone meant to come back to.
          for KEY in NSCameraUsageDescription NSMicrophoneUsageDescription \
                     NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription \
                     NSFaceIDUsageDescription; do
            VAL=$(grep -A1 "<key>${KEY}</key>" "$PLIST" | tail -1 \
              | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
            if [ -z "$VAL" ] || [ "${#VAL}" -lt 25 ]; then
              echo "  ERROR   ${KEY} missing or too vague: '${VAL}'"
              FAIL=1
            else
              echo "  ok      ${KEY} (${#VAL} chars)"
            fi
          done

          echo
          echo "Privacy manifest:"
          # Apple mails ITMS-91053 "Missing API declaration" when a binary uses
          # a required-reason API without declaring it. A manifest sitting on
          # disk but absent from the Resources build phase ships nothing, so
          # check both.
          if [ ! -f ios/Runner/PrivacyInfo.xcprivacy ]; then
            echo "  ERROR   ios/Runner/PrivacyInfo.xcprivacy does not exist."
            FAIL=1
          elif ! grep -q "PrivacyInfo.xcprivacy in Resources" ios/Runner.xcodeproj/project.pbxproj; then
            echo "  ERROR   PrivacyInfo.xcprivacy exists but is not in the Resources build phase."
            FAIL=1
          else
            echo "  ok      present and wired into the Resources build phase"
          fi

          echo
          echo "App icon:"
          # An alpha channel in the 1024 marketing icon is an automatic
          # rejection at upload. PNG colour type lives at byte 25: 4 and 6
          # carry alpha, 2 and 3 do not.
          ICON=ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          if [ ! -f "$ICON" ]; then
            echo "  ERROR   1024x1024 marketing icon missing."
            FAIL=1
          else
            COLORTYPE=$(od -An -tu1 -j25 -N1 "$ICON" | tr -d ' ')
            if [ "$COLORTYPE" = "4" ] || [ "$COLORTYPE" = "6" ]; then
              echo "  ERROR   marketing icon has an alpha channel (PNG colour type $COLORTYPE)."
              echo "          Set remove_alpha_ios: true and rerun flutter_launcher_icons."
              FAIL=1
            else
              echo "  ok      marketing icon has no alpha (PNG colour type $COLORTYPE)"
            fi
          fi

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: iOS configuration would likely be rejected — see above."
            exit 1
          fi
          echo "iOS configuration OK."
      - name: Install CocoaPods dependencies
        script: |
          set -e
          # Was `find . -name "Podfile" -execdir pod install \;`, which reports
          # *find's* exit code: a failed pod install passed this step green and
          # surfaced two steps later as "Pods.xcodeproj not found", hiding the
          # real error. Run it directly so it fails here, with its own log.
          #
          # The Podfile raises if ios/Flutter/Generated.xcconfig is missing
          # (written by `flutter pub get`), so check that first — it is the most
          # common cause and its message is clearer than CocoaPods' backtrace.
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "ERROR: ios/Flutter/Generated.xcconfig missing — 'flutter pub get' did not complete."
            exit 1
          fi
          cd ios
          # --repo-update: the build image's spec mirror can lag behind a newly
          # bumped plugin (Firebase especially), and without it pod install dies
          # on "none of your spec sources contain a spec satisfying the dependency".
          pod install --repo-update
      - name: Verify permission macros reached the Pods project
        script: |
          # permission_handler_apple compiles each permission behind a macro
          # that defaults to 0, so a missing macro produces an app where iOS
          # silently never shows the permission alert — it builds and ships
          # clean, and only App Review finds it. Two rejections came from
          # exactly this. Fail the build here instead.
          PBXPROJ=ios/Pods/Pods.xcodeproj/project.pbxproj
          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: $PBXPROJ not found — did pod install run?"
            exit 1
          fi
          MISSING=0
          for MACRO in PERMISSION_MICROPHONE PERMISSION_CAMERA \
                       PERMISSION_NOTIFICATIONS PERMISSION_PHOTOS \
                       PERMISSION_PHOTOS_ADD_ONLY; do
            if grep -q "${MACRO}=1" "$PBXPROJ"; then
              echo "  ok      ${MACRO}=1"
            else
              echo "  MISSING ${MACRO}=1"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "ERROR: permission macros absent from the generated Pods project."
            echo "Check the post_install block in ios/Podfile."
            exit 1
          fi
          echo "All permission macros present."
      - name: Audit the resolved pod graph
        script: |
          set -e
          # ios/Podfile.lock is NOT committed and this pipeline runs
          # `pod install --repo-update`, so every build resolves its own
          # versions and the binary Apple reviews can match nothing ever tested
          # locally. Print what actually resolved so the log is a record, then
          # fail on the shape that aborts at load: two majors of one shared
          # Google runtime, pulled in by Firebase on one side and
          # GoogleMLKit (via mobile_scanner) on the other.
          LOCK=ios/Podfile.lock
          if [ ! -f "$LOCK" ]; then
            echo "ERROR: $LOCK missing — pod install did not complete."
            exit 1
          fi
          echo "Resolved Firebase / Google / MLKit pods:"
          sed -n 's/^  - \(Firebase[^ ]*\|Google[^ ]*\|MLKit[^ ]*\|nanopb\|Protobuf\|GTMSessionFetcher[^ ]*\) (\([^)]*\)).*/  \1 \2/p' "$LOCK" | sort -u
          echo
          CONFLICT=0
          for RUNTIME in GoogleUtilities GoogleDataTransport GoogleToolboxForMac \
                         GTMSessionFetcher Protobuf nanopb; do
            MAJORS=$(sed -n "s|^  - ${RUNTIME}\(/[^ ]*\)\{0,1\} (\([0-9][0-9]*\)\..*|\2|p" "$LOCK" | sort -u)
            COUNT=$(printf '%s\n' "$MAJORS" | grep -c '^[0-9]' || true)
            if [ "$COUNT" -gt 1 ]; then
              echo "  CONFLICT ${RUNTIME}: majors $(printf '%s ' $MAJORS)"
              CONFLICT=1
            elif [ "$COUNT" -eq 1 ]; then
              echo "  ok       ${RUNTIME} major ${MAJORS}"
            fi
          done
          if [ "$CONFLICT" -ne 0 ]; then
            echo
            echo "ERROR: two majors of a shared Google runtime resolved into one app."
            echo "Both copies register the same Objective-C classes at load time,"
            echo "which aborts before Dart runs — a launch crash on every device."
            echo "Pin firebase_core / mobile_scanner in pubspec.yaml until they agree."
            exit 1
          fi
          # Assert `use_frameworks! :linkage => :static` actually took effect.
          # firebase_core, firebase_messaging and mobile_scanner all declare
          # static_framework in their podspecs; if Firebase is being embedded
          # as a dynamic framework anyway, we are back to the mixed linkage
          # that shipped in 1.0.9(15).
          FW_SCRIPT="ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks.sh"
          if [ -f "$FW_SCRIPT" ] && grep -q "Firebase[A-Za-z]*\.framework" "$FW_SCRIPT"; then
            echo
            echo "ERROR: Firebase is being embedded as a DYNAMIC framework."
            echo "ios/Podfile must keep 'use_frameworks! :linkage => :static'."
            exit 1
          fi
          # Nothing may reintroduce Swift Package Manager alongside CocoaPods:
          # that is what produced "123 duplicate symbols" on GoogleDataTransport.
          if grep -q "XCLocalSwiftPackageReference\|XCRemoteSwiftPackageReference\|packageReferences" \
               ios/Runner.xcodeproj/project.pbxproj; then
            echo
            echo "ERROR: Swift Package Manager references are back in the Xcode project."
            echo "Combined with CocoaPods this duplicates GoogleDataTransport and"
            echo "fails to link. The 'Disable Swift Package Manager' step must run"
            echo "before anything touches ios/."
            exit 1
          fi
          echo
          echo "Pod graph OK — one copy of each shared runtime, static linkage, no SPM."
      - name: Verify the UIScene migration is committed, not applied at build time
        script: |
          set -e
          # `flutter build ios` migrates AppDelegate.swift and Info.plist to the
          # UIScene lifecycle in-place when they still match the old template.
          # That ran silently in the build clone, so the binary Apple reviewed
          # had an entry point that existed nowhere in the repo. Both files are
          # migrated in-tree now; this asserts they stayed that way, and that
          # the build did not rewrite them underneath us.
          if ! grep -q "UIApplicationSceneManifest" ios/Runner/Info.plist; then
            echo "ERROR: Info.plist has no UIApplicationSceneManifest."
            exit 1
          fi
          if ! grep -q "FlutterImplicitEngineDelegate" ios/Runner/AppDelegate.swift; then
            echo "ERROR: AppDelegate.swift is not on the UIScene lifecycle."
            exit 1
          fi
          if ! git diff --quiet -- ios/Runner/Info.plist ios/Runner/AppDelegate.swift ios/Podfile; then
            echo "ERROR: the build modified committed iOS entry-point files:"
            git --no-pager diff --stat -- ios/Runner/Info.plist ios/Runner/AppDelegate.swift ios/Podfile
            echo "Commit that migration instead of letting each build re-apply it."
            exit 1
          fi
          echo "UIScene lifecycle committed; the build did not rewrite it."
      - name: Launch smoke test on iPhone and iPad simulators
        script: |
          set -e
          # The check that would have caught the 1.0.9(15) rejection: actually
          # start the app and confirm it is alive, with a rendered frame, some
          # seconds later. Every other step here verifies that the app BUILDS.
          # This one verifies that it RUNS, on both device families Apple
          # reviews on — they explicitly called out iPad.
          #
          # Scope, honestly: this is a DEBUG SIMULATOR build. It does not cover
          # AOT- or device-only faults (pod linkage, entitlements, code
          # signing) — the pod audit above and the IPA inspection below are
          # what cover those. It does cover the entire Dart cold-start path:
          # a missing asset, a dotenv throw, Firebase configuration, a provider
          # constructor that raises, anything that stops the first frame.
          mkdir -p /tmp/smoke
          rm -f /tmp/smoke/*.png /tmp/smoke/*.ips /tmp/smoke/*.log

          # Tripwire against regressing to mobile_scanner 5/6, which pinned
          # GoogleMLKit ~> 6.0.0. Those MLKit binaries ship no arm64 SIMULATOR
          # slice, and arm64 is mandatory for iOS 26 simulators on Apple
          # Silicon (this runner), so the simulator build could not link at all:
          #
          #   The following target(s) do not support arm64 architecture ...
          #     GoogleMLKit, MLImage, MLKitBarcodeScanning, MLKitCommon, MLKitVision
          #
          # mobile_scanner 7 replaced MLKit with Apple's Vision framework on
          # iOS, so its podspec now depends on nothing but Flutter. Skip rather
          # than fail if someone pins back: losing the smoke test should not
          # also block a release, and the reason is printed loudly.
          SCANNER=$(sed -n '/^  mobile_scanner:$/,/^  [a-z_]*:$/p' pubspec.lock \
            | sed -n 's/^    version: "\(.*\)"$/\1/p' | head -1)
          if [ -n "$SCANNER" ] && [ "${SCANNER%%.*}" -lt 7 ]; then
            echo "=============================================================="
            echo " SKIPPED — launch smoke test cannot run on this runner."
            echo " mobile_scanner ${SCANNER} pulls MLKit binaries with no arm64"
            echo " simulator slice; iOS 26 simulators on Apple Silicon require"
            echo " arm64. Re-upgrade mobile_scanner to >= 7 to restore it."
            echo "=============================================================="
            exit 0
          fi

          # Counts distinct quantised colours in a PNG, for the blank-screen
          # heuristic below. CoreGraphics only — nothing to install.
          cat > /tmp/smoke/distinct_colors.swift <<'SWIFT'
          import Foundation
          import CoreGraphics
          import ImageIO

          guard CommandLine.arguments.count > 1,
                let src = CGImageSourceCreateWithURL(
                  URL(fileURLWithPath: CommandLine.arguments[1]) as CFURL, nil),
                let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else { exit(2) }
          let w = img.width, h = img.height
          guard w > 0, h > 0 else { exit(2) }
          var buf = [UInt8](repeating: 0, count: w * h * 4)
          guard let ctx = CGContext(data: &buf, width: w, height: h,
                                    bitsPerComponent: 8, bytesPerRow: w * 4,
                                    space: CGColorSpaceCreateDeviceRGB(),
                                    bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue)
          else { exit(2) }
          ctx.draw(img, in: CGRect(x: 0, y: 0, width: w, height: h))
          var seen = Set<Int>()
          var y = 0
          while y < h {
            var x = 0
            while x < w {
              let i = (y * w + x) * 4
              // Quantise to 5 bits per channel so JPEG-ish noise and subtle
              // gradients don't read as thousands of "distinct" colours.
              let key = (Int(buf[i]) >> 3) << 10 | (Int(buf[i+1]) >> 3) << 5 | (Int(buf[i+2]) >> 3)
              seen.insert(key)
              x += 8
            }
            y += 8
          }
          print(seen.count)
          SWIFT

          flutter build ios --simulator --debug
          APP=build/ios/iphonesimulator/Runner.app
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP was not produced."
            exit 1
          fi

          # The exact hardware App Review used on submission
          # f67bdb8d-9093-4df2-8983-f0b4d7fcac40 (2026-08-19), iOS/iPadOS
          # 26.6.1. Testing the same device names on the same major OS is the
          # closest a runner can get to reproducing that review without real
          # hardware. Update these if a later rejection names different devices.
          REVIEW_IPHONE="iPhone 17 Pro Max"
          REVIEW_IPAD="iPad Air 11-inch (M3)"
          REVIEW_OS_MAJOR=26

          xcrun simctl list devices available > /tmp/smoke/devices.txt

          udid_of() {
            printf '%s' "$1" | sed -n 's/.*(\([0-9A-Fa-f]\{8\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{12\}\)).*/\1/p'
          }

          # Exact device-name match, newest iOS runtime wins (simctl lists them
          # oldest-first, so the last hit is the newest). Matching on
          # "<name> (" is what keeps "iPhone 17 Pro" from selecting
          # "iPhone 17 Pro Max", and what makes "iPad Air 11-inch (M3)" work
          # at all — its model suffix is itself parenthesised.
          # Emits "udid|runtime|name".
          resolve_exact() {
            WANT="$1"; RT=""; RESULT=""
            while IFS= read -r LINE; do
              case "$LINE" in
                "-- iOS "*) RT=${LINE#-- }; RT=${RT% --} ;;
                "-- "*) RT="" ;;
                *)
                  [ -n "$RT" ] || continue
                  case "$LINE" in
                    *"$WANT ("*)
                      UD=$(udid_of "$LINE")
                      [ -n "$UD" ] && RESULT="${UD}|${RT}|${WANT}" ;;
                  esac ;;
              esac
            done < /tmp/smoke/devices.txt
            printf '%s' "$RESULT"
          }

          # Any device of the family, newest runtime, when the review device
          # isn't on this image and can't be created.
          resolve_family() {
            FAM="$1"; RT=""; RESULT=""
            while IFS= read -r LINE; do
              case "$LINE" in
                "-- iOS "*) RT=${LINE#-- }; RT=${RT% --} ;;
                "-- "*) RT="" ;;
                *)
                  [ -n "$RT" ] || continue
                  TRIMMED=$(printf '%s' "$LINE" | sed 's/^[[:space:]]*//')
                  case "$TRIMMED" in
                    "$FAM"*)
                      UD=$(udid_of "$LINE")
                      [ -n "$UD" ] && RESULT="${UD}|${RT}|${TRIMMED%% (*}" ;;
                  esac ;;
              esac
            done < /tmp/smoke/devices.txt
            printf '%s' "$RESULT"
          }

          # The image may ship the device TYPE without a ready-made simulator.
          create_exact() {
            WANT="$1"
            DTYPE=$(xcrun simctl list devicetypes | grep -F "$WANT (" \
              | sed -n 's/.*(\(com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*\)).*/\1/p' | head -1)
            RUNTIME=$(xcrun simctl list runtimes available | grep "^iOS " | tail -1 \
              | sed -n 's/.*\(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*\).*/\1/p')
            [ -n "$DTYPE" ] && [ -n "$RUNTIME" ] || return 1
            xcrun simctl create "corex-smoke-${2}" "$DTYPE" "$RUNTIME" 2>/dev/null
          }

          smoke() {
            LABEL="$1"; WANT="$2"; FAMILY="$3"
            MATCHED_REVIEW_DEVICE=no

            FOUND=$(resolve_exact "$WANT")
            if [ -n "$FOUND" ]; then
              MATCHED_REVIEW_DEVICE=yes
            else
              NEW_UDID=$(create_exact "$WANT" "$LABEL" || true)
              if [ -n "$NEW_UDID" ]; then
                xcrun simctl list devices available > /tmp/smoke/devices.txt
                FOUND=$(resolve_exact "$WANT")
                [ -n "$FOUND" ] && MATCHED_REVIEW_DEVICE=yes
              fi
            fi
            if [ -z "$FOUND" ]; then
              FOUND=$(resolve_family "$FAMILY")
            fi
            if [ -z "$FOUND" ]; then
              echo "ERROR: no available '${FAMILY}' simulator on this image."
              cat /tmp/smoke/devices.txt
              return 1
            fi

            UDID=${FOUND%%|*}
            REST=${FOUND#*|}
            RUNTIME_NAME=${REST%%|*}
            DEVICE_NAME=${REST#*|}

            echo "--- ${LABEL}: ${DEVICE_NAME} on ${RUNTIME_NAME} (${UDID}) ---"
            if [ "$MATCHED_REVIEW_DEVICE" = "yes" ]; then
              echo "  matches the App Review device (${WANT})"
            else
              echo "  WARNING: '${WANT}' is not available on this image and could"
              echo "  not be created; testing ${DEVICE_NAME} instead. App Review"
              echo "  used ${WANT}, so this run does not reproduce their device."
            fi
            OS_MAJOR=$(printf '%s' "$RUNTIME_NAME" | sed -n 's/^iOS \([0-9][0-9]*\).*/\1/p')
            if [ -n "$OS_MAJOR" ] && [ "$OS_MAJOR" -lt "$REVIEW_OS_MAJOR" ]; then
              echo "  WARNING: ${RUNTIME_NAME} is older than the iOS ${REVIEW_OS_MAJOR}"
              echo "  App Review ran. Newer-OS-only faults will not show up here."
            fi
            # Crash reports land here; clear first so we only read this run's.
            rm -f "$HOME/Library/Logs/DiagnosticReports/Runner"*.ips 2>/dev/null || true
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$UDID" -b || return 1
            xcrun simctl uninstall "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$APP" || return 1

            # Launch with the app's stdout captured, in the background.
            # `set -e` is suspended inside a function called as
            # `smoke ... || FAILED=1`, so anything that must stop this device
            # carries its own `|| return 1`.
            LOG="/tmp/smoke/${LABEL}.log"
            xcrun simctl launch --terminate-running-process --console-pty \
              "$UDID" "$BUNDLE_ID" > "$LOG" 2>&1 &
            LAUNCH_JOB=$!

            # Poll rather than sleep a fixed window. The first run of this step
            # failed on a 25s sleep, on a runner that had just spent 63s on
            # simulator data migration and 20s on install+launch — a cold debug
            # Flutter app on a still-settling simulator can simply be slower
            # than any constant worth hardcoding. Polling also returns
            # immediately on success, so the healthy path got faster.
            #
            # Two independent signals, because that first failure could not
            # distinguish "never rendered" from "Dart's stdout never reached
            # the pty" (the log held the app's NSLog line and PID, but no Dart
            # output at all):
            #   log  — kFirstFrameMarker on stdout
            #   file — the same marker written into the app container
            # Either proves a frame rendered. Which one fired is reported, so
            # a stdout-capture problem is visible instead of looking like a
            # launch failure.
            DEADLINE=150
            WAITED=0
            SIGNAL=none
            while [ "$WAITED" -lt "$DEADLINE" ]; do
              if grep -q "COREX_FIRST_FRAME_OK" "$LOG" 2>/dev/null; then
                SIGNAL=log; break
              fi
              CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
              if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/COREX_FIRST_FRAME_OK" ]; then
                SIGNAL=file; break
              fi
              if ls "$HOME/Library/Logs/DiagnosticReports/Runner"*.ips >/dev/null 2>&1; then
                echo "  crash report appeared after ${WAITED}s"
                break
              fi
              sleep 3
              WAITED=$((WAITED + 3))
            done
            echo "  waited ${WAITED}s; first-frame signal: ${SIGNAL}"

            xcrun simctl io "$UDID" screenshot "/tmp/smoke/${LABEL}.png" >/dev/null 2>&1 || true
            kill "$LAUNCH_JOB" 2>/dev/null || true
            wait "$LAUNCH_JOB" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true

            CRASH=$(ls "$HOME/Library/Logs/DiagnosticReports/Runner"*.ips 2>/dev/null | head -1)
            if [ -n "$CRASH" ]; then
              echo "  CRASHED — report follows:"
              cp "$CRASH" "/tmp/smoke/${LABEL}-crash.ips"
              cat "$CRASH"
              return 1
            fi

            # The gate. NOT "is the process still alive" — that passes for the
            # exact failure this step exists to catch: main() throwing before
            # runApp leaves a live process on a black screen with no crash
            # report. Both signals are written from the same post-frame
            # callback in lib/main.dart, so either one proves a real frame.
            if [ "$SIGNAL" = "log" ]; then
              echo "  ok — first frame rendered (stdout marker)."
            elif [ "$SIGNAL" = "file" ]; then
              echo "  ok — first frame rendered (container breadcrumb)."
              echo "  NOTE: the app rendered, but the marker never appeared on"
              echo "  stdout. Dart output is not reaching 'simctl launch"
              echo "  --console-pty' on this Xcode, which means the Dart error"
              echo "  scan below is running against an incomplete log and is"
              echo "  much weaker than it looks. Worth fixing."
            else
              echo "  ERROR: no first frame after ${WAITED}s, by either signal."
              echo "  Neither the stdout marker nor the container breadcrumb"
              echo "  appeared, and both are written from the same post-frame"
              echo "  callback — so the app genuinely did not render."
              echo "  --- captured output ---"
              cat "$LOG" || true
              return 1
            fi

            # Rendering is necessary but not sufficient. A reviewer who lands on
            # a red error screen or a visibly broken layout files it under the
            # same 2.1(a) as a crash, so treat a caught Dart error during launch
            # as a failure. The last two patterns are our own handlers in
            # lib/main.dart, which catch anything the framework surfaces.
            if grep -nE "EXCEPTION CAUGHT BY|Unhandled Exception:|A RenderFlex overflowed|Failed assertion:|\[zone\] uncaught:|\[flutter\] uncaught:" "$LOG"; then
              echo "  ERROR: Dart errors during launch (matches printed above)."
              return 1
            fi
            echo "  ok — no Dart exceptions or overflows during launch."

            # Guard the case the marker cannot catch: a frame rendered, then
            # something painted a single flat colour over everything. Advisory
            # only — a screenshot can legitimately be near-uniform (a full-
            # bleed splash), and blocking a release on image heuristics would
            # cost more than it saves. The PNG is in the artifacts either way.
            if [ -f "/tmp/smoke/${LABEL}.png" ] && command -v swift >/dev/null 2>&1; then
              COLORS=$(swift /tmp/smoke/distinct_colors.swift "/tmp/smoke/${LABEL}.png" 2>/dev/null || echo "")
              if [ -n "$COLORS" ]; then
                if [ "$COLORS" -le 2 ]; then
                  echo "  WARNING: screenshot has only ${COLORS} distinct colour(s) —"
                  echo "  the screen may be blank. Open /tmp/smoke/${LABEL}.png in the artifacts."
                else
                  echo "  ok — screenshot has ${COLORS} distinct colours (not a blank screen)."
                fi
              fi
            fi
            return 0
          }

          FAILED=0
          smoke iphone "$REVIEW_IPHONE" "iPhone" || FAILED=1
          smoke ipad   "$REVIEW_IPAD"   "iPad"   || FAILED=1
          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: the app did not survive launch on at least one simulator."
            echo "Screenshots and any crash report are in the build artifacts."
            exit 1
          fi
          echo
          echo "Launch smoke test passed on iPhone and iPad."
          echo "Check the screenshot artifacts: a black frame means it launched"
          echo "but never rendered, which App Review also reads as a crash."
      - name: Set up code signing (fetch or create cert + profile)
        script: |
          keychain initialize
          # --create registers the bundle id / creates the distribution
          # certificate and App Store provisioning profile if they don't exist.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Verify the provisioning profile carries aps-environment
        script: |
          # aps-environment is a PROFILE-DERIVED entitlement: it only reaches the
          # binary if Push Notifications is enabled on the App ID in the Apple
          # Developer portal. If it isn't, the build still succeeds and ships an
          # app that silently cannot register with APNs — getToken() fails,
          # MessagingService swallows it, and no device token is ever recorded.
          # Same class of invisible failure as the permission macros above, so
          # it gets the same treatment: fail the build here instead.
          # Do NOT hardcode the profile directory. Xcode 16 moved it from
          #   ~/Library/MobileDevice/Provisioning Profiles
          # to
          #   ~/Library/Developer/Xcode/UserData/Provisioning Profiles
          # and the Codemagic CLI writes to whichever the installed Xcode
          # expects — so with `xcode: latest` the path is not ours to assume.
          # Search for the files instead; the location is printed below so a
          # future move is obvious rather than silent.
          find "$HOME" -maxdepth 8 -name "*.mobileprovision" 2>/dev/null > /tmp/profiles.txt
          COUNT=0
          MATCHED=0
          FOUND=0
          echo "Provisioning profiles found under $HOME:"
          while IFS= read -r P; do
            [ -f "$P" ] || continue
            COUNT=$((COUNT + 1))
            PLIST=$(security cms -D -i "$P" 2>/dev/null)
            NAME=$(printf '%s' "$PLIST" | plutil -extract Name raw -o - - 2>/dev/null)
            APPID=$(printf '%s' "$PLIST" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null)
            APS=$(printf '%s' "$PLIST" | plutil -extract Entitlements.aps-environment raw -o - - 2>/dev/null)
            echo "  - ${NAME:-<unnamed>}"
            echo "      path:                   $P"
            echo "      application-identifier: ${APPID:-<none>}"
            echo "      aps-environment:        ${APS:-<ABSENT>}"
            # Only a profile for OUR bundle id counts. A stray profile for some
            # other app carrying the entitlement must not green-light the build.
            case "$APPID" in
              *".$BUNDLE_ID")
                MATCHED=$((MATCHED + 1))
                [ -n "$APS" ] && FOUND=1
                ;;
            esac
          done < /tmp/profiles.txt
          echo
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no provisioning profiles exist anywhere under $HOME."
            echo "This is NOT the push capability — code signing setup itself produced"
            echo "no profile. Check the 'Set up code signing' step above, the App Store"
            echo "Connect integration, and the CERTIFICATE_PRIVATE_KEY variable."
            exit 1
          fi
          if [ "$MATCHED" -eq 0 ]; then
            echo "ERROR: $COUNT profile(s) present but NONE match bundle id $BUNDLE_ID."
            echo "Codemagic is signing a different app than codemagic.yaml declares."
            exit 1
          fi
          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: the profile for $BUNDLE_ID does not carry aps-environment."
            echo
            echo "Fix: Apple Developer portal -> Certificates, Identifiers & Profiles"
            echo "  1. Identifiers -> $BUNDLE_ID -> tick Push Notifications -> Save."
            echo "     (Edit the EXISTING identifier; do not register a new one.)"
            echo "  2. Profiles -> delete the App Store profile for $BUNDLE_ID."
            echo "     Ticking the capability marks it Invalid but does NOT update it,"
            echo "     and fetch-signing-files reuses whatever profile already exists —"
            echo "     so without deleting it, this step fails again unchanged."
            echo
            echo "Both steps are required. Doing (1) alone leaves this failing."
            exit 1
          fi
          echo "OK: profile for $BUNDLE_ID carries aps-environment."
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Inspect the shipped IPA
        script: |
          set -e
          # Last gate, on the exact bytes that go to Apple. The simulator smoke
          # test ran a debug build; this covers what only the signed release
          # artifact can show — what actually got bundled, and whether it is
          # really a release build.
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: no IPA in build/ios/ipa/."
            exit 1
          fi
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP="$WORK/Payload/Runner.app"
          PLIST="$APP/Info.plist"
          FAIL=0

          echo "Bundled resources:"
          # Each of these is absent-and-silent in some failure mode: a missing
          # GoogleService-Info.plist makes FirebaseApp.configure() raise an
          # Objective-C exception that Dart cannot catch, and a missing
          # storyboard is an uncaught NSInternalInconsistencyException. Both
          # are SIGABRT before the first frame.
          # Deliberately not asserting individual AppIcon*.png names or the
          # asset-manifest filename: both move between Xcode and Flutter
          # releases, and a missing icon is caught by Apple's own upload
          # validation anyway. These are the ones that fail silently at launch.
          #
          # Storyboards are PBXVariantGroups (they live in ios/Runner/Base.lproj),
          # so ibtool compiles them to Base.lproj/Name.storyboardc, NOT the
          # bundle root — checking only the root reported them missing on a
          # perfectly good IPA. Accept either location.
          for R in "GoogleService-Info.plist" \
                   "PrivacyInfo.xcprivacy" \
                   "Main.storyboardc" \
                   "LaunchScreen.storyboardc" \
                   "Assets.car" \
                   "Frameworks/App.framework/App" \
                   "Frameworks/Flutter.framework/Flutter" \
                   "Frameworks/App.framework/flutter_assets/.env"; do
            if [ -e "$APP/$R" ]; then
              echo "  ok      $R"
            elif [ -e "$APP/Base.lproj/$R" ]; then
              echo "  ok      Base.lproj/$R"
            else
              echo "  MISSING $R (checked bundle root and Base.lproj/)"
              FAIL=1
            fi
          done

          echo
          echo "Bundled configuration:"
          BUNDLED_API=$(sed -n 's/^API_BASE_URL=//p' "$APP/Frameworks/App.framework/flutter_assets/.env" 2>/dev/null | tr -d '\r')
          echo "  API_BASE_URL            ${BUNDLED_API:-<ABSENT>}"
          if [ "$BUNDLED_API" != "https://corexos.co.za/api" ]; then
            echo "  ERROR: the SHIPPED .env does not point at production."
            FAIL=1
          fi
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          PUBSPEC_BUILD=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)
          echo "  CFBundleVersion         $BUNDLE_VERSION (pubspec: $PUBSPEC_BUILD)"
          if [ "$BUNDLE_VERSION" != "$PUBSPEC_BUILD" ]; then
            echo "  ERROR: the build number did not reach the binary."
            FAIL=1
          fi
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          PUBSPEC_NAME=$(sed -n 's/^version: \(.*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)
          echo "  CFBundleShortVersionString $SHORT_VERSION (pubspec: $PUBSPEC_NAME)"
          if [ "$SHORT_VERSION" != "$PUBSPEC_NAME" ]; then
            echo "  ERROR: the marketing version did not reach the binary."
            FAIL=1
          fi
          # These two are checked on the source plist early, but Xcode and the
          # export step can both rewrite Info.plist, so re-assert on what ships.
          if /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$PLIST" >/dev/null 2>&1; then
            echo "  ERROR: UIRequiresFullScreen reached the binary (iPad multitasking opted out)."
            FAIL=1
          else
            echo "  ok      no UIRequiresFullScreen"
          fi
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$PLIST" >/dev/null 2>&1; then
            echo "  ERROR: NSAllowsArbitraryLoads reached the binary (ATS disabled)."
            FAIL=1
          else
            echo "  ok      App Transport Security intact"
          fi
          # Apple reviews on iPad and expects it to work; 1 and 2 must both be
          # present or the iPad run is a scaled-up iPhone build.
          FAMILY=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$PLIST" 2>/dev/null | tr -d ' \n' || true)
          echo "  UIDeviceFamily          $FAMILY"
          case "$FAMILY" in
            *1*2*) ;;
            *) echo "  ERROR: not a universal build — iPad is not in UIDeviceFamily."; FAIL=1 ;;
          esac
          # Every permission the app can ask for needs its purpose string, or
          # iOS kills the process the moment the API is touched.
          for KEY in NSCameraUsageDescription NSMicrophoneUsageDescription \
                     NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription \
                     NSFaceIDUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              echo "  ok      $KEY"
            else
              echo "  MISSING $KEY"
              FAIL=1
            fi
          done

          echo
          echo "Architectures:"
          # A simulator slice in an App Store binary is an instant upload
          # rejection; a missing arm64 slice means it cannot run on any
          # supported device.
          ARCHS=$(lipo -archs "$APP/Runner" 2>/dev/null || echo "")
          echo "  Runner binary           ${ARCHS:-<unreadable>}"
          case "$ARCHS" in
            *arm64*) echo "  ok      arm64 present" ;;
            *) echo "  ERROR: no arm64 slice."; FAIL=1 ;;
          esac
          case "$ARCHS" in
            *x86_64*) echo "  ERROR: x86_64 simulator slice present in a store build."; FAIL=1 ;;
            *) echo "  ok      no simulator slice" ;;
          esac

          echo
          echo "Signature:"
          # Parse the entitlements as a plist. Grepping for a bare key name is
          # wrong: App Store distribution entitlements routinely carry
          # `get-task-allow` explicitly set to <false/>, so presence of the KEY
          # proves nothing — only the VALUE does. The earlier key-only grep
          # failed a perfectly good IPA, and the same sloppiness made the
          # aps-environment line print the team identifier.
          ENT_FILE="$WORK/entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$ENT_FILE" 2>/dev/null || true
          GTA=absent
          APS=absent
          if plutil -lint "$ENT_FILE" >/dev/null 2>&1; then
            GTA=$(plutil -extract get-task-allow raw -o - "$ENT_FILE" 2>/dev/null || echo absent)
            APS=$(plutil -extract aps-environment raw -o - "$ENT_FILE" 2>/dev/null || echo absent)
          else
            # Value-aware fallback if the blob isn't a parseable plist.
            echo "  note    entitlements not parseable as a plist; using text fallback"
            if grep -A1 "<key>get-task-allow</key>" "$ENT_FILE" 2>/dev/null | grep -q "<true/>"; then
              GTA=true
            elif grep -q "get-task-allow" "$ENT_FILE" 2>/dev/null; then
              GTA=false
            fi
            APS=$(grep -A1 "<key>aps-environment</key>" "$ENT_FILE" 2>/dev/null \
              | sed -n 's|.*<string>\(.*\)</string>.*|\1|p' | head -1)
            APS=${APS:-absent}
          fi

          # get-task-allow=true means a debuggable binary. The App Store
          # sandbox refuses to launch one — an instant, total launch crash.
          if [ "$GTA" = "true" ]; then
            echo "  ERROR: get-task-allow is TRUE. This is a debuggable build;"
            echo "  it will crash on launch for every App Store user."
            FAIL=1
          else
            echo "  ok      get-task-allow=${GTA} (not a debuggable build)"
          fi

          echo "  aps-environment         ${APS}"
          if [ "$APS" = "development" ]; then
            echo "  WARNING: signed for the APNs SANDBOX, not production."
            echo "  The app installs and runs, so this will not fail review —"
            echo "  but every production push silently goes nowhere. Check that"
            echo "  the export step re-signed with the distribution profile."
          elif [ "$APS" = "absent" ]; then
            echo "  WARNING: no aps-environment — push notifications cannot"
            echo "  register at all. See the profile check earlier in this build."
          fi
          codesign -dv "$APP" 2>&1 | sed -n 's/^/  /p' || true

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: the IPA failed inspection — see the lines above."
            exit 1
          fi
          echo "IPA inspection passed."
      - name: Human checklist before submitting
        script: |
          # Not a gate — everything below is outside what CI can see, and every
          # one of them has rejected an app before. Printed last so it is the
          # final thing in the log when you go to hit Submit.
          cat <<'EOF'
          ==========================================================
           AUTOMATED GATES PASSED. THESE ARE STILL ON YOU:
          ==========================================================

           1. DEMO ACCOUNT (Guideline 2.1 — the most common rejection
              for a login-walled app). App Store Connect -> App Review
              Information -> Sign-In Required. Give a working agent
              email + password, and confirm it still logs in TODAY
              against production. A demo account that expired between
              submissions reads to a reviewer as a broken app.

           2. iPAD. Reviewers use an iPad Air 11" and they rotate it.
              Open the app on an iPad, in portrait AND landscape, and
              walk the main tabs. CI proves it launches; it cannot see
              a layout that overflows in landscape.

           3. THE FEATURE BEHIND EACH PERMISSION must work. Prior
              rejections here were microphone prompts that never
              appeared. Physically test: camera capture, photo save,
              microphone, Face ID, notifications.

           4. PRIVACY ANSWERS. ios/Runner/PrivacyInfo.xcprivacy
              declares tracking=false and an EMPTY collected-data
              list; App Store Connect's App Privacy questionnaire is
              the authoritative answer. Make sure the two do not
              contradict each other.

           5. WHAT CHANGED THIS BUILD. If the rejection reason is
              addressed, reply in Resolution Center saying how —
              a reply materially speeds up re-review.

           6. SCREENSHOTS/METADATA must match what the build actually
              does. Stale screenshots are a 2.3 rejection.

          ==========================================================
          EOF
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # Launch-smoke evidence: screenshot + captured stdout per device family,
      # plus any simulator crash report. Worth opening even on a green build.
      - /tmp/smoke/*.log
      - /tmp/smoke/*.png
      - /tmp/smoke/*.ips
    publishing:
      app_store_connect:
        auth: integration
        # The IPA is uploaded and processed regardless of the flags below —
        # that alone makes it installable by internal TestFlight testers
        # (App Store Connect users), which needs no review.
        #
        # submit_to_testflight submits for EXTERNAL beta review, which requires
        # Beta App Information (feedback email) and Beta App Review Information
        # (name, phone, email) to be filled in under TestFlight → Test
        # Information. Left off so the pipeline doesn't fail on a step that
        # isn't needed to ship to the App Store. Turn on once those forms are
        # filled and you actually want outside testers.
        submit_to_testflight: false
        # Kept manual: the App Store submission is attached to a version record
        # and needs a Resolution Center reply to the 2.1(a) rejection.
        submit_to_app_store: false
