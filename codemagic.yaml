workflows:
  ios-release:
    name: CoreX OS – iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Exact name of the App Store Connect API key integration in Codemagic:
      #   Codemagic → Teams/User settings → Integrations → App Store Connect.
      app_store_connect: CoreX ASC
    environment:
      groups:
        # Codemagic env-var group holding CERTIFICATE_PRIVATE_KEY (the RSA key
        # used to create/reuse the iOS distribution certificate).
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "za.co.corexMobile"
    scripts:
      - name: Create .env (required asset)
        script: cp .env.example .env
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (fetch or create cert + profile)
        script: |
          keychain initialize
          # --create registers the bundle id / creates the distribution
          # certificate and App Store provisioning profile if they don't exist.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Flip to true later to auto-submit for App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
