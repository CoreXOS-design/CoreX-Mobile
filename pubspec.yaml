name: corex_mobile
description: CoreX OS - Home Finders Coastal mobile app.
publish_to: 'none'
version: 1.0.10+19

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.0
  image_picker: ^1.0.0
  image: ^4.8.0
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.0
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.0
  # Must stay >= 7. Versions 5/6 pin GoogleMLKit ~> 6.0.0, whose MLKitCommon
  # requires GoogleDataTransport (< 10.0), while firebase_messaging requires
  # (~> 10.1) — CocoaPods cannot satisfy both and `pod install` fails outright.
  # Before Swift Package Manager was disabled that conflict was hidden, not
  # solved: CocoaPods took MLKit's GDT 9.x, SPM brought Firebase's 10.x, and
  # both shipped in one binary. mobile_scanner 7 uses Apple's Vision framework
  # on iOS and pulls no Google pods at all, which removes the clash entirely
  # (Android still uses MLKit via Gradle, where there is no conflict).
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  tabler_icons: ^2.5.0+1
  share_plus: ^10.0.0
  gal: ^2.3.0
  record: ^5.2.1
  path_provider: ^2.1.4
  timezone: ^0.10.1
  open_filex: ^4.5.0

dependency_overrides:
  # Patched local copy: original tabler_icons subclasses IconData, which is
  # now `final` in Flutter >= 3.40 and breaks the build.
  tabler_icons:
    path: third_party/tabler_icons
  # record_linux 0.7.2 (transitively pulled by record 5.2.1) doesn't implement
  # the startStream / updated hasPermission API on record_platform_interface
  # 1.6.0, breaking even Android builds. Force the newer record_linux.
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/corex_launcher_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0D0F14"
  adaptive_icon_background: "#0D0F14"
  adaptive_icon_foreground: "assets/images/corex_launcher_icon.png"
  adaptive_icon_monochrome: "assets/images/corex_launcher_icon.png"
  windows:
    generate: true
    image_path: "assets/images/corex_launcher_icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#0D0F14"
  image: assets/images/corex_logo_splash.png
  color_dark: "#0D0F14"
  image_dark: assets/images/corex_logo_splash.png
  android_12:
    image: assets/images/corex_logo_splash.png
    color: "#0D0F14"
    image_dark: assets/images/corex_logo_splash.png
    color_dark: "#0D0F14"
  android: true
  ios: true
  web: false
